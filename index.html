<!DOCTYPE html>

<head>

<style>

    background:#0a0a0a;
    color:#f2f2f2;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;

  .panel{

    font-weight:700;
    margin-bottom:16px;
  }
  .body{
    font-size:15px;
    color:#cfcfcf;
  }
  .body + .body{ margin-top:12px; }
  .foot{
    margin-top:40px;
    font-size:12px;
    letter-spacing:.1em;
    color:#7a7a7a;
  }

<body>
  <main class="wrap">
